name: cai_listhenics
description: Analiza series de dominadas y guarda el histórico en el dispositivo.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.6.0 <4.0.0"   # withValues() pide Dart 3.6 / Flutter 3.27

dependencies:
  flutter:
    sdk: flutter

  # Grabación. El flujo de captura es donde se muere la beta: si el encuadre
  # falla, el usuario no dice por qué, deja de usarla.
  camera: ^0.11.0

  # Subida y sondeo del análisis.
  http: ^1.2.0

  # Histórico en el dispositivo.
  sqflite: ^2.3.3
  path: ^1.9.0
  path_provider: ^2.1.4

  # Reproducción de vídeo con trackpoints
  video_player: ^2.9.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    # Copia de esquema/001_inicial.sql de la raíz del repo. La original manda;
    # `tests/test_cliente.py` comprueba que no han divergido.
    - assets/esquema/001_inicial.sql
    - assets/images/banner.jpeg
    - assets/images/logo.jpg
